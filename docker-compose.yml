services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    environment:
      - RAILS_ENV=production
      - RAILS_SERVE_STATIC_FILES=true
      - DOCKER_ENV=true
      - DATABASE_HOST=host.docker.internal
      - DATABASE_NAME=sp5
      - DATABASE_USER=root
      - DATABASE_PASSWORD=
      - DATABASE_PORT=3306
